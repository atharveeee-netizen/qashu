<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <title>Qashu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="og:site_name" content="Qashu"/>
  <meta property="og:title" content="Qashu"/>
  <meta property="og:type" content="website"/>
  <meta name="description" content="Qashu - Self-directed Quantum Reference Knowledge Base"/>

  <!-- Fonts & KaTeX -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;700&family=Source+Sans+Pro:ital,wght@0,400;0,600;1,400;1,600&family=IBM+Plex+Mono:wght@400;600&display=swap"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous"/>

  <!-- Qashu Quartz Theme Stylesheet -->
  <link rel="stylesheet" href="./style.css"/>
</head>
<body data-slug="qashu-index">

  <div id="quartz-root" class="page">
    <div id="quartz-body">

      <!-- Left Sidebar Hover Reveal Edge Trigger Zone -->
      <div id="left-hover-zone" class="hover-zone left-zone"></div>

      <!-- Left Sidebar Panel -->
      <aside class="left sidebar" id="left-sidebar">
        <div class="sidebar-header">
          <h2 class="page-title"><a href="#" id="home-logo-link">Qashu</a></h2>
          <button id="pin-left-sidebar" class="btn-pin" title="Pin / Unpin Left Sidebar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v10m0 0l4-4m-4 4L8 8m-4 14h16"/></svg>
          </button>
        </div>
        
        <div class="sidebar-controls">
          <!-- Search Button -->
          <div class="search">
            <button class="search-button" id="btn-search" aria-label="Search">
              <svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 19.9 19.7" width="16" height="16">
                <title>Search</title>
                <g stroke="currentColor" fill="none">
                  <path stroke-linecap="square" d="M18.5 18.3l-5.4-5.4"></path>
                  <circle cx="8" cy="8" r="7"></circle>
                </g>
              </svg>
              <span>Search</span>
            </button>
          </div>

          <!-- Darkmode Toggle -->
          <button class="darkmode" id="btn-darkmode" aria-label="Toggle theme">
            <svg xmlns="http://www.w3.org/2000/svg" class="dayIcon" viewBox="0 0 35 35" width="16" height="16" fill="currentColor">
              <path d="M6,17.5C6,16.672,5.328,16,4.5,16h-3C0.672,16,0,16.672,0,17.5S0.672,19,1.5,19h3C5.328,19,6,18.328,6,17.5z M17.5,6C18.329,6,19,5.328,19,4.5v-3C19,0.672,18.329,0,17.5,0S16,0.672,16,1.5v3C16,5.328,16.671,6,17.5,6z M17.5,25c-4.136,0-7.5-3.364-7.5-7.5c0-4.136,3.364-7.5,7.5-7.5c4.136,0,7.5,3.364,7.5,7.5C25,21.636,21.636,25,17.5,25z"></path>
            </svg>
          </button>
        </div>

        <!-- Explorer Category Folder Tree -->
        <div class="explorer">
          <div class="explorer-title-row">
            <h2>Explorer</h2>
          </div>
          <div class="explorer-content">
            <ul class="explorer-folder-tree" id="explorer-tree">
              <!-- Dynamically populated category folders -->
            </ul>
          </div>
        </div>
      </aside>

      <!-- Main Center Content Area -->
      <main class="center">
        <div class="page-header">
          <nav class="breadcrumb-container" aria-label="breadcrumbs">
            <div class="breadcrumb-element"><a href="#" id="crumb-home">Home</a><p> ❯ </p></div>
            <div class="breadcrumb-element"><span id="crumb-title">Qashu</span></div>
          </nav>
          <h1 class="article-title" id="main-article-title">Qashu</h1>
          <p class="content-meta"><time id="main-article-date">Jul 27, 2026</time> <span>• 16 min read</span></p>
        </div>

        <article class="popover-hint">
          <div id="markdown-content" class="markdown-preview-view markdown-rendered">
            <!-- Article Content Loaded Here -->
          </div>
        </article>
      </main>

      <!-- Right Sidebar Hover Reveal Edge Trigger Zone -->
      <div id="right-hover-zone" class="hover-zone right-zone"></div>

      <!-- Right Sidebar Panel -->
      <aside class="right sidebar" id="right-sidebar">
        <div class="sidebar-header">
          <h2>Graph View</h2>
          <button id="pin-right-sidebar" class="btn-pin" title="Pin / Unpin Right Sidebar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v10m0 0l4-4m-4 4L8 8m-4 14h16"/></svg>
          </button>
        </div>

        <!-- Mini Interactive Canvas Graph Widget -->
        <div class="graph-widget">
          <canvas id="mini-graph-canvas" width="260" height="180"></canvas>
        </div>

        <!-- Table of Contents Section -->
        <div class="toc-widget">
          <h3>Table of Contents</h3>
          <ul id="toc-list" class="toc-list">
            <!-- Populated by app.js -->
          </ul>
        </div>

        <!-- Backlinks Section -->
        <div class="backlinks-widget">
          <h3>Backlinks</h3>
          <ul id="backlinks-list" class="backlinks-list">
            <!-- Populated by app.js -->
          </ul>
        </div>
      </aside>

    </div>
  </div>

  <!-- Search Modal Overlay -->
  <div id="search-modal" class="search-modal" style="display: none;">
    <div class="search-backdrop"></div>
    <div class="search-modal-box">
      <input type="text" id="modal-search-input" class="search-modal-input" placeholder="Search Qashu reference notes..." autofocus/>
      <div id="search-results-list" class="search-results-list"></div>
    </div>
  </div>

  <!-- KaTeX Engine & App Module -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script type="module" src="./app.js"></script>

</body>
</html>
